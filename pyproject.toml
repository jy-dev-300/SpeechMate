[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "speechmate"
version = "0.1.0"
description = "A pronunciation coach with phoneme-level feedback and persistent learner profiles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
speech = ["faster-whisper>=1.1,<2"]
dev = ["httpx>=0.27,<1", "pytest>=8.3,<9", "ruff>=0.7,<1"]

[tool.hatch.build.targets.wheel]
packages = ["backend", "speech", "models", "evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
